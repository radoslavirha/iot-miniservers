---
name: Release APPs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release APPs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-apps-matrix.outputs.json }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Prepare repository
        uses: ./.github/actions/prepare
        with:
          NODE_AUTH_TOKEN: ${{ secrets.TOOLKIT_HUB_PACKAGES }}
      - name: Create Release Pull Request and Publish
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: Release APPs
          commit-message: Version APIs
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:tag
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set APPs matrix
        id: set-apps-matrix
        shell: bash
        run: |
          packages='${{ steps.changesets.outputs.published-packages }}'
          if [ -z "$packages" ] || [ "$packages" = "null" ] || [ "$packages" = "[]" ]; then
            echo "json={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          include="[]"
          for app_dir in apis ui; do
            for pkg_json in "${app_dir}"/*/package.json; do
              [ -f "$pkg_json" ] || continue
              dir=$(dirname "$pkg_json")
              target=$(basename "$dir")
              if [ ! -f "${dir}/deploy.json" ]; then
                continue
              fi
              pkg_name=$(jq -r '.name' "$pkg_json")
              version=$(echo "$packages" | jq -r --arg n "$pkg_name" '.[] | select(.name == $n) | .version')
              if [ -n "$version" ]; then
                include=$(echo "$include" | jq -c --arg p "${app_dir}/${target}" --arg v "$version" '. + [{"path": $p, "version": $v}]')
              fi
            done
          done
          if [ "$include" = "[]" ]; then
            echo "json={}" >> "$GITHUB_OUTPUT"
          else
            echo "json={\"include\":$include}" >> "$GITHUB_OUTPUT"
          fi
  build-app-images:
    name: Publish ${{ matrix.path }} ${{ matrix.version }}
    needs:
      - release
    if: ${{ needs.release.outputs.matrix != '{}' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.release.outputs.matrix) }}
    uses: ./.github/workflows/docker-build-app.yaml
    secrets: inherit
    with:
      APP_PATH: ${{ matrix.path }}
      PUBLISH: true

  deploy-sandbox:
    name: Deploy to Sandbox
    needs:
      - release
      - build-app-images
    if: ${{ needs.release.outputs.matrix != '{}' }}
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
    steps:
      - name: Checkout iot-miniservers
        uses: actions/checkout@v7
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          environment: sandbox
          packages: ${{ toJSON(fromJSON(needs.release.outputs.matrix).include) }}
          homelab_pat: ${{ secrets.HOMELAB_PAT }}

  deploy-production:
    name: Deploy to Production
    needs:
      - release
      - deploy-sandbox
    if: ${{ needs.release.outputs.matrix != '{}' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout iot-miniservers
        uses: actions/checkout@v7
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          environment: production
          packages: ${{ toJSON(fromJSON(needs.release.outputs.matrix).include) }}
          homelab_pat: ${{ secrets.HOMELAB_PAT }}
