---
name: Build Docker image and publish to GHCR if requested

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      APP_PATH:
        description: Full app path relative to repo root (e.g. apis/qr-manager-api or ui/qr-manager-ui)
        required: true
        type: string
      PUBLISH:
        description: Whether to build and publish to GHCR or just build the image
        required: true
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      APP_PATH:
        description: Full app path relative to repo root (e.g. apis/qr-manager-api or ui/qr-manager-ui)
        required: true
        type: string
      PUBLISH:
        description: Whether to build and publish to GHCR or just build the image
        required: true
        default: false
        type: boolean

jobs:
  image-data:
    name: Extract image information
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.information.outputs.target }}
      image: ${{ steps.information.outputs.image }}
      description: ${{ steps.information.outputs.description }}
      version: ${{ steps.information.outputs.version }}
      date: ${{ steps.set_date.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Get image informations
        id: information
        shell: bash
        run: |
          target=$(basename "${{ inputs.APP_PATH }}")
          echo "target=${target}" >> "$GITHUB_OUTPUT"

          name=$(yq -r --no-colors eval '.name' "${{ inputs.APP_PATH }}/package.json")
          echo "image=ghcr.io/radoslavirha/${name}" >> "$GITHUB_OUTPUT"

          description=$(yq -r --no-colors eval '.description' "${{ inputs.APP_PATH }}/package.json")
          echo "description=${description}" >> "$GITHUB_OUTPUT"

          version=$(yq -r --no-colors eval '.version' "${{ inputs.APP_PATH }}/package.json")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ inputs.APP_PATH }} docker image
    runs-on: ubuntu-latest
    needs: image-data
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Prepare npm auth file
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TOOLKIT_HUB_PACKAGES }}
        run: |
          cat > /tmp/npmrc.auth <<EOF
          @radoslavirha:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          chmod 600 /tmp/npmrc.auth
      - name: Login to GHCR
        if: ${{ inputs.PUBLISH == true || inputs.PUBLISH == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.PUBLISH }}
          load: true
          context: .
          file: Dockerfile
          target: ${{ needs.image-data.outputs.target }}
          tags: |
            ${{ needs.image-data.outputs.image }}:latest
            ${{ needs.image-data.outputs.image }}:${{ needs.image-data.outputs.version }}
          secret-files: |
            "npmrc=/tmp/npmrc.auth"
          labels: |
            maintainer=Radoslav Irha <radoslav.irha@gmail.com>
            org.opencontainers.image.title=${{ needs.image-data.outputs.image }}
            org.opencontainers.image.description=${{ needs.image-data.outputs.description }}
            org.opencontainers.image.vendor=Radoslav Irha IoT Miniservers
            org.opencontainers.image.authors=Radoslav Irha <radoslav.irha@gmail.com>
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/${{ inputs.APP_PATH }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/${{ inputs.APP_PATH }}/README.md
            org.opencontainers.image.created=${{ needs.image-data.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.image-data.outputs.version }}
      - name: Cleanup npm auth file
        if: always()
        run: rm -f /tmp/npmrc.auth
