---
name: Pull request

# yamllint disable-line rule:truthy
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Check changes
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    outputs:
      apis: ${{ steps.filter-apis.outputs.changes }}
      packages: ${{ steps.filter-packages.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: 📂 Detect changed APIs
        uses: dorny/paths-filter@v3
        id: filter-apis
        with:
          filters: .github/paths-filter-apis.yaml
      - name: 📂 Detect changed packages
        uses: dorny/paths-filter@v3
        id: filter-packages
        with:
          filters: .github/paths-filter-packages.yaml

  build-api-images:
    name: Build ${{ matrix.name }} docker images
    needs: changes
    if: ${{ needs.changes.outputs.apis != '[]' }}
    # permissions:
    #   contents: write
    strategy:
      matrix:
        api: ${{ fromJSON(needs.changes.outputs.apis) }}
    uses: ./.github/workflows/docker-build-api.yaml
    secrets: inherit
    with:
      TARGET: ${{ matrix.api }}
      PUBLISH: false

  build-package-code:
    name: Code build => ${{ matrix.package }}
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.packages != '[]' }}
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare repository
        uses: ./.github/actions/prepare
        with:
          NODE_AUTH_TOKEN: ${{ secrets.TOOLKIT_HUB_PACKAGES }}
      - name: Run build
        run: pnpm --filter ./packages/${{ matrix.package }} build
