---
name: Prepare repository
description: Prepare repository for further actions
inputs:
  NODE_AUTH_TOKEN:
    description: A Node auth token / GitHub token
    required: true
  TARGET_APP:
    description: App path relative to repo root (e.g. apis/qr-manager-api or ui/qr-manager-ui)
    required: false
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up pnpm v11
      uses: pnpm/action-setup@v4
      with:
        version: 11
    - name: Set up Node.js v24
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm
        registry-url: https://npm.pkg.github.com/
        scope: '@radoslavirha'
    - name: Configure pnpm auth token
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NODE_AUTH_TOKEN }}
      run: pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
    - name: Install ${{ inputs.TARGET_APP }} dependencies
      if: "${{ inputs.TARGET_APP != '' }}"
      run: pnpm install --frozen-lockfile --filter "./${{ inputs.TARGET_APP }}" --filter "./packages/**"
      shell: bash
    - name: Build workspace packages
      if: "${{ inputs.TARGET_APP != '' }}"
      run: pnpm --filter './packages/**' run build
      shell: bash
    - name: Install dependencies
      if: "${{ inputs.TARGET_APP == '' }}"
      run: pnpm install --frozen-lockfile
      shell: bash
