---
name: Deploy to environment
description: Updates Helm image tags in homelab and pushes a single commit

inputs:
  environment:
    description: Target environment (sandbox or production)
    required: true
  packages:
    description: 'JSON array of apps, e.g. [{"path":"apis/miot-bridge-api","version":"0.2.3"}]'
    required: true
  homelab_pat:
    description: PAT with contents:write on radoslavirha/homelab
    required: true

runs:
  using: composite
  steps:
    - name: Checkout homelab
      uses: actions/checkout@v7
      with:
        repository: radoslavirha/homelab
        token: ${{ inputs.homelab_pat }}
        path: homelab
    - name: Install yq
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
    - name: Update image tags
      shell: bash
      env:
        ENV: ${{ inputs.environment }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        echo "$PACKAGES" | jq -c '.[]' | while read pkg; do
          APP_PATH=$(echo "$pkg" | jq -r '.path')
          VERSION=$(echo "$pkg" | jq -r '.version')
          DEPLOY_CONFIG="${APP_PATH}/deploy.json"
          if [ ! -f "$DEPLOY_CONFIG" ]; then
            echo "No deploy.json for ${APP_PATH}, skipping"
            continue
          fi
          if ! jq -e ".$ENV" "$DEPLOY_CONFIG" > /dev/null 2>&1; then
            echo "Environment '${ENV}' not found in deploy.json for ${APP_PATH}, skipping"
            continue
          fi
          FILE=$(jq -r ".$ENV.file" "$DEPLOY_CONFIG")
          YAML_PATH=$(jq -r ".$ENV.yamlPath" "$DEPLOY_CONFIG")
          echo "Updating ${APP_PATH} to ${VERSION} in homelab/${FILE} at ${YAML_PATH}"
          yq e "$YAML_PATH = \"$VERSION\"" -i "homelab/$FILE"
        done
    - name: Commit and push
      shell: bash
      env:
        ENV: ${{ inputs.environment }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        cd homelab
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        APPS=$(echo "$PACKAGES" | jq -r '[.[] | "\(.path)@\(.version)"] | join(", ")')
        git add .
        git diff --staged --quiet || git commit -m "chore(iot): deploy $ENV [$APPS]"
        git push
