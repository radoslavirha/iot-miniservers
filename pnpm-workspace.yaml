    '@tsed/platform-http': ^8.38.4
    '@tsed/platform-middlewares': ^8.38.4
    '@tsed/platform-params': ^8.38.4
    '@tsed/platform-response-filter': ^8.38.4
    '@tsed/platform-views': ^8.38.4
    '@tsed/schema': ^8.38.4
    '@tsed/swagger': ^8.38.4
    '@tsed/testcontainers-mongo': ^8.38.4
    ajv: ^8.20.0

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build
allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@radoslavirha/*'
