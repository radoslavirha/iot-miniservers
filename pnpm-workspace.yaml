  tslib: ^2.8.1
  typescript: ^6.0.3
  typescript-eslint: ^8.70.0
  vitest: ^5.0.0
  zod: 4.6.0

catalogs:
  express:
    '@types/compression': ^1.8.1
    '@types/cookie-parser': ^1.4.10
    '@types/cors': ^2.8.19
    '@types/express': ^5.0.6
    '@types/method-override': ^3.0.0
    '@types/multer': ^2.2.0
